<!doctype html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spese Lavoro</title>
  
  <!-- Tailwind CSS per il design -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Lucide Icons per le icone -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0b0b0e',
            surface: '#141418',
            surface2: '#1e1e24',
            border: '#2a2a34',
            accent: '#c8f135',
            muted: '#777',
          }
        }
      }
    }
  </script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; }
    .mono { font-family: 'DM Mono', monospace; }
    .chip { transition: all 0.15s; }
    .chip.sel { transform: scale(1.04); }
    input:focus { border-color: #c8f135 !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .spinner { width: 16px; height: 16px; border: 2px solid #333; border-top-color: #c8f135; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .expense-item { animation: fadeIn 0.25s ease; }
    .confirm-bar { display: flex; gap: 8px; margin-top: 8px; }
    .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    
    /* Personalizzazioni colori per i bottoni */
    .btn-anticipo.sel { background-color: #facc15 !important; border-color: #facc15 !important; color: #000 !important; font-weight: bold !important; }
    .btn-scontrino.sel { background-color: #c8f135 !important; border-color: #c8f135 !important; color: #000 !important; font-weight: bold !important; }
    .btn-fattura.sel { background-color: #a78bfa !important; border-color: #a78bfa !important; color: #fff !important; font-weight: bold !important; }
  </style>
</head>

<body class="h-full bg-bg text-white">
  <div id="app" class="h-full flex flex-col overflow-auto">
    <!-- Header -->
    <header class="bg-surface border-b border-border px-4 py-3 flex items-center justify-between sticky top-0 z-50">
      <div class="mono text-accent text-sm font-medium tracking-wider" id="headerTitle">
        SPESE LAVORO
      </div>
      <div class="flex items-center gap-2">
        <span id="recordCount" class="text-xs text-muted mono">0 voci</span> 
        <span id="syncDot" class="w-2 h-2 rounded-full bg-green-500"></span>
      </div>
    </header>
    
    <!-- Tabs -->
    <nav class="flex bg-surface border-b border-border">
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-accent border-accent active-tab" data-tab="add"> 
        <i data-lucide="plus-circle" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>NUOVA 
      </button> 
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-muted border-transparent" data-tab="list"> 
        <i data-lucide="list" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>ELENCO 
      </button> 
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-muted border-transparent" data-tab="stats"> 
        <i data-lucide="bar-chart-3" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>RIEPILOGO 
      </button>
    </nav>
    
    <!-- Add Panel -->
    <div id="panel-add" class="panel flex-1 p-4 scroll-area">
      
      <!-- Riga Unica: Importo + Data + Inserimento IA -->
      <div class="bg-surface border border-accent/30 rounded-2xl p-4 mb-4 relative overflow-hidden shadow-[0_0_15px_rgba(200,241,53,0.05)]">
        <div class="flex flex-col md:flex-row gap-3 items-end">
          
          <!-- Importo -->
          <div class="flex-1 w-full">
            <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Importo €</label> 
            <input type="number" id="amountInput" step="0.01" min="0" placeholder="0.00" class="w-full bg-surface2 border border-border rounded-xl text-white mono text-[16px] px-3 outline-none h-[46px]">
          </div>

          <!-- Data -->
          <div class="flex-1 w-full">
            <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Data</label> 
            <input type="date" id="dateInput" class="w-full bg-surface2 border border-border rounded-xl text-white mono text-[13px] px-3 outline-none h-[46px]">
          </div>

          <!-- Box Testo Libero -->
          <div class="flex-1 md:flex-[2] w-full">
            <label class="text-[10px] font-bold tracking-widest text-accent uppercase block mb-2 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3 h-3"></i> Testo Libero
            </label>
            <div class="flex items-center w-full bg-surface2 border border-border rounded-xl focus-within:border-accent transition-colors overflow-hidden h-[46px]">
              <input type="text" id="aiInput" placeholder="Es: 15€ parcheggio contanti..." class="flex-1 bg-transparent text-white text-sm outline-none w-full h-full px-3">
              <button id="aiParseBtn" class="bg-accent/10 hover:bg-accent/20 border-l border-accent/20 text-accent font-semibold transition-colors px-4 h-full flex items-center justify-center">
                 ✨
              </button>
            </div>
          </div>

        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Categoria</label>
        <div class="flex flex-wrap gap-1.5" id="categoryChips">
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🍽 Pranzo">🍽 Pranzo</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="⛽ Carburante">⛽ Carburante</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🅿️ Parcheggio">🅿️ Parcheggio</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🚗 Pedaggio">🚗 Pedaggio</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🚌 Mezzo">🚌 Mezzo</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="📦 Materiale">📦 Materiale</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="💻 Software">💻 Software</button>
        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Pagamento</label>
        <div class="flex flex-wrap gap-1.5" id="payChips">
          <button class="chip btn-anticipo px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="anticipo">💰 Anticipo</button> 
          <button class="chip btn-scontrino px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="scontrino">🧾 Scontrino</button> 
          <button class="chip btn-fattura px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="fattura">📄 Fattura</button>
        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <div>
          <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Note (opzionale)</label> 
          <input type="text" id="noteInput" placeholder="Descrizione..." class="w-full bg-surface2 border border-border rounded-xl text-white text-sm px-3 py-2.5 outline-none">
        </div>
      </div>
      
      <button id="saveBtn" class="w-full bg-accent text-bg font-bold text-sm py-3 rounded-xl transition-all active:scale-[0.97] disabled:opacity-40"> 
        <i data-lucide="save" class="inline w-4 h-4 mr-1 align-middle"></i>SALVA SPESA 
      </button>
      <div id="saveError" class="text-red-400 text-xs text-center mt-2 hidden"></div>
    </div>
    
    <!-- List Panel -->
    <div id="panel-list" class="panel flex-1 p-4 scroll-area hidden">
      <div id="expenseList" class="space-y-2"></div>
      <div id="emptyList" class="text-center text-muted text-sm py-12">
        <i data-lucide="inbox" class="mx-auto mb-3 w-10 h-10 opacity-30"></i>
        <p>Nessuna spesa registrata</p>
      </div>
    </div>
    
    <!-- Stats Panel -->
    <div id="panel-stats" class="panel flex-1 p-4 scroll-area hidden">
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
          <label class="text-[10px] font-bold tracking-widest text-muted uppercase">Mese</label>
          <div class="flex items-center gap-2">
            <button id="prevMonth" class="p-1.5 bg-surface2 border border-border rounded-lg hover:border-accent transition-colors"> <i data-lucide="chevron-left" class="w-4 h-4"></i> </button> 
            <span id="monthDisplay" class="mono text-sm font-semibold min-w-[120px] text-center text-accent">Mese</span> 
            <button id="nextMonth" class="p-1.5 bg-surface2 border border-border rounded-lg hover:border-accent transition-colors"> <i data-lucide="chevron-right" class="w-4 h-4"></i> </button>
          </div>
        </div>
        <div id="totalAmount" class="mono text-4xl font-bold text-accent text-center py-4">
          € 0,00
        </div>
        <button id="syncBtn" class="w-full bg-accent/10 border border-accent/30 text-accent font-semibold text-xs py-2.5 rounded-lg hover:bg-accent/20 transition-all flex items-center justify-center gap-1"> 
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> <span id="syncBtnText">SINCRONIZZA SUL CLOUD</span> 
        </button>
        <button id="downloadCsvBtn" class="w-full mt-2 bg-surface2 border border-border text-white font-semibold text-xs py-2.5 rounded-lg hover:border-accent transition-all flex items-center justify-center"> 
          <i data-lucide="download" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>SCARICA CSV DEL MESE
        </button>
      </div>

      <!-- AI Analysis -->
      <div class="bg-surface border border-accent/30 rounded-2xl p-4 mb-4">
        <button id="aiAnalyzeBtn" class="w-full bg-accent/10 border border-accent/50 text-accent font-semibold text-xs py-2.5 rounded-lg hover:bg-accent/20 transition-all flex items-center justify-center gap-2">
          ✨ Analizza Spese con IA
        </button>
        <div id="aiAnalysisResult" class="text-sm text-gray-300 mt-3 hidden leading-relaxed border-t border-border pt-3"></div>
      </div>

      <div id="monthBreakdown" class="space-y-3"></div>
    </div>
  </div>
  
  <div id="toast" class="toast bg-surface2 text-accent border border-accent/30"></div>
  
  <script>
    // --- CONFIGURAZIONE ---
    // URL del Google Apps Script che riceve i dati
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG4vImpIpe5AY6m0BG-BmZPFTznScz4UEPnRJdnTeDgsklvjZJzid_GNfgqNNUC0UI/exec';

    // API Key per Gemini
    const apiKey = "";

    // Funzione di utilità per chiamare Gemini con Retry automatico
    async function fetchGeminiWithRetry(url, payload, retries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.json();
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(r => setTimeout(r, delays[i]));
        }
      }
    }

    // State
    let allExpenses = [];
    let selectedCategory = null;
    let selectedPay = null;
    let deleteConfirmId = null;
    let currentMonth = new Date(); 

    // Inizializzazione data odierna
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    
    // Inizializza le icone al caricamento
    lucide.createIcons();

    // Caricamento Dati Locali
    function loadLocalData() {
      try {
        const savedData = localStorage.getItem('spese_lavoro_data');
        if (savedData) {
          allExpenses = JSON.parse(savedData);
        }
      } catch (e) {
        console.error("Errore nel caricamento dei dati locali", e);
      }
      document.getElementById('recordCount').textContent = allExpenses.length + ' voci';
      updateSyncUI();
      renderList();
      renderStats();
    }
    
    // Esegui caricamento dati all'avvio
    loadLocalData();

    // Aggiornamento interfaccia Sincronizzazione
    function updateSyncUI() {
      const unsyncedCount = allExpenses.filter(e => !e.synced).length;
      const dot = document.getElementById('syncDot');
      const syncBtnText = document.getElementById('syncBtnText');

      if (unsyncedCount > 0) {
        dot.classList.remove('bg-green-500');
        dot.classList.add('bg-orange-500', 'animate-pulse');
        if (syncBtnText) syncBtnText.textContent = `SINCRONIZZA SUL CLOUD (${unsyncedCount})`;
      } else {
        dot.classList.remove('bg-orange-500', 'animate-pulse');
        dot.classList.add('bg-green-500');
        if (syncBtnText) syncBtnText.textContent = `TUTTO SINCRONIZZATO`;
      }
    }

    // Gestione Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active-tab', 'text-accent', 'border-accent');
          b.classList.add('text-muted', 'border-transparent');
        });
        btn.classList.add('active-tab', 'text-accent', 'border-accent');
        btn.classList.remove('text-muted', 'border-transparent');

        document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    // Chips Categoria
    document.querySelectorAll('#categoryChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#categoryChips .chip').forEach(c => {
          c.classList.remove('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold');
        });
        chip.classList.add('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold');
        selectedCategory = chip.dataset.cat;
      });
    });

    // Chips Pagamento
    document.querySelectorAll('#payChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#payChips .chip').forEach(c => {
          c.classList.remove('sel');
        });
        chip.classList.add('sel');
        selectedPay = chip.dataset.pay;
      });
    });

    // Funzione Salva
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const amount = parseFloat(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;
      const note = document.getElementById('noteInput').value.trim();
      const errEl = document.getElementById('saveError');
      errEl.classList.add('hidden');

      if (!selectedCategory || !selectedPay || !amount || amount <= 0 || !date) {
        errEl.textContent = 'Compila categoria, pagamento, importo e data.';
        errEl.classList.remove('hidden');
        return;
      }

      // Crea l'oggetto spesa con flag synced a false
      const newExpense = {
        __backendId: Date.now().toString(),
        category: selectedCategory,
        payment_type: selectedPay,
        amount,
        date,
        note,
        created_at: new Date().toISOString(),
        synced: false // Flag per capire cosa deve essere inviato
      };

      try {
        // Salvataggio SOLO in Locale per massima velocità
        allExpenses.push(newExpense);
        localStorage.setItem('spese_lavoro_data', JSON.stringify(allExpenses));
        
        // Aggiorna UI
        document.getElementById('recordCount').textContent = allExpenses.length + ' voci';
        updateSyncUI();
        renderList();
        renderStats();

        showToast('✓ Salvato in locale! (Sincronizzazione in sospeso)');
        
        // Reset form
        document.getElementById('amountInput').value = '';
        document.getElementById('noteInput').value = '';
        selectedCategory = null; selectedPay = null;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel','!bg-accent','!border-accent','!text-black','!font-bold'));
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

      } catch (error) {
        console.error("Errore salvataggio locale:", error);
        errEl.textContent = 'Errore imprevisto di memoria.';
        errEl.classList.remove('hidden');
      }
    });

    // Render della Lista (Archivio)
    function renderList() {
      const container = document.getElementById('expenseList');
      const empty = document.getElementById('emptyList');
      const sorted = [...allExpenses].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created_at || '').localeCompare(a.created_at || ''));

      if (sorted.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      const existingIds = new Set(sorted.map(e => e.__backendId));
      const currentEls = new Map([...container.children].map(el => [el.dataset.id, el]));

      currentEls.forEach((el, id) => { if (!existingIds.has(id)) el.remove(); });

      let prev = null;
      sorted.forEach(exp => {
        let el = container.querySelector(`[data-id="${exp.__backendId}"]`);
        if (!el) {
          el = document.createElement('div');
          el.dataset.id = exp.__backendId;
          el.className = 'expense-item bg-surface border border-border rounded-xl p-3';
          container.appendChild(el);
        }

        const isConfirming = deleteConfirmId === exp.__backendId;
        
        // Format date better
        const dateObj = new Date(exp.date);
        const dateStr = dateObj.toLocaleDateString('it-IT', {day: '2-digit', month: 'short'});

        // Icona di stato cloud
        const syncIcon = exp.synced 
          ? `<i data-lucide="cloud-lightning" class="inline w-3 h-3 text-green-500/50 ml-1" title="Sincronizzato"></i>` 
          : `<i data-lucide="cloud-off" class="inline w-3 h-3 text-orange-400 ml-1 animate-pulse" title="In attesa di sync"></i>`;

        el.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex-1 min-w-0">
              <div class="text-sm font-semibold truncate text-white">${exp.category || ''}</div>
              <div class="text-xs text-muted mt-0.5">${dateStr} · <span class="capitalize">${exp.payment_type || ''}</span>${syncIcon}${exp.note ? ' · ' + escHtml(exp.note) : ''}</div>
            </div>
            <div class="mono text-sm font-bold text-accent ml-3 whitespace-nowrap">€ ${(exp.amount || 0).toFixed(2)}</div>
          </div>
          ${isConfirming ? `
            <div class="confirm-bar">
              <button class="flex-1 bg-red-500/20 text-red-400 border border-red-500/30 text-xs font-bold py-1.5 rounded-lg confirm-del-yes" data-id="${exp.__backendId}">Conferma Eliminazione</button>
              <button class="flex-1 bg-surface2 text-muted text-xs font-bold py-1.5 rounded-lg confirm-del-no" data-id="${exp.__backendId}">Annulla</button>
            </div>
          ` : `
            <button class="mt-2 text-xs text-red-400/60 hover:text-red-400 transition-colors del-btn" data-id="${exp.__backendId}">
              <i data-lucide="trash-2" class="inline w-3 h-3 mr-0.5 align-middle"></i>Elimina voce
            </button>
          `}
        `;

        if (prev) { prev.after(el); } else { container.prepend(el); }
        prev = el;
      });

      lucide.createIcons();
      bindDeleteButtons();
    }

    function bindDeleteButtons() {
      document.querySelectorAll('.del-btn').forEach(btn => {
        btn.onclick = () => {
          deleteConfirmId = btn.dataset.id;
          renderList();
        };
      });
      document.querySelectorAll('.confirm-del-no').forEach(btn => {
        btn.onclick = () => {
          deleteConfirmId = null;
          renderList();
        };
      });
      document.querySelectorAll('.confirm-del-yes').forEach(btn => {
        btn.onclick = async () => {
          const id = btn.dataset.id;
          
          // Eliminazione locale
          allExpenses = allExpenses.filter(e => e.__backendId !== id);
          localStorage.setItem('spese_lavoro_data', JSON.stringify(allExpenses));
          
          deleteConfirmId = null;
          document.getElementById('recordCount').textContent = allExpenses.length + ' voci';
          updateSyncUI();
          renderList();
          renderStats();
          showToast('Spesa eliminata (Localmente)');
        };
      });
    }

    // Render Statistiche
    function renderStats() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      
      const monthNames = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
      document.getElementById('monthDisplay').textContent = monthNames[month] + ' ' + year;
      
      const monthExpenses = allExpenses.filter(e => {
        if (!e.date) return false;
        const expDate = new Date(e.date);
        return expDate.getFullYear() === year && expDate.getMonth() === month;
      });
      
      const total = monthExpenses.reduce((s, e) => s + (e.amount || 0), 0);
      document.getElementById('totalAmount').textContent = '€ ' + total.toFixed(2).replace('.', ',');
      
      const byCat = {};
      monthExpenses.forEach(e => {
        if (!byCat[e.category]) {
          byCat[e.category] = { total: 0, byPayment: {} };
        }
        byCat[e.category].total += (e.amount || 0);
        byCat[e.category].byPayment[e.payment_type] = (byCat[e.category].byPayment[e.payment_type] || 0) + (e.amount || 0);
      });
      
      const payLabels = { anticipo: '💰 Anticipo', scontrino: '🧾 Scontrino', fattura: '📄 Fattura' };
      const breakdown = Object.entries(byCat)
        .sort((a, b) => b[1].total - a[1].total)
        .map(([cat, data]) => `
          <div class="bg-surface border border-border rounded-xl p-3">
            <div class="flex justify-between items-center mb-2">
              <span class="text-sm font-semibold text-white">${cat}</span>
              <span class="mono text-sm text-accent font-bold">€ ${data.total.toFixed(2)}</span>
            </div>
            <div class="w-full bg-surface2 rounded-full h-2 mb-2">
              <div class="bg-accent h-2 rounded-full" style="width:${total ? (data.total/total*100) : 0}%"></div>
            </div>
            <div class="space-y-1 text-xs">
              ${Object.entries(data.byPayment)
                .sort((a, b) => b[1] - a[1])
                .map(([pay, amt]) => `
                  <div class="flex justify-between text-muted pl-2 border-l border-surface2">
                    <span class="capitalize">${payLabels[pay] || pay}</span>
                    <span class="mono font-medium">€ ${amt.toFixed(2)}</span>
                  </div>
                `).join('')}
            </div>
          </div>
        `).join('');
      
      document.getElementById('monthBreakdown').innerHTML = breakdown || '<p class="text-muted text-sm text-center py-4">Nessun dato per questo mese</p>';
    }

    // Navigazione Mesi
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
      renderStats();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
      renderStats();
    });

    // --- FUNZIONI GEMINI AI ---

    const aiInput = document.getElementById('aiInput');
    
    // 1. Inserimento Magico (JSON strutturato)
    document.getElementById('aiParseBtn').addEventListener('click', async () => {
      const text = aiInput.value.trim();
      if (!text) return showToast('Inserisci del testo prima di usare l\'IA!');

      const btn = document.getElementById('aiParseBtn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner w-3.5 h-3.5 border-accent"></span>';

      const todayStr = new Date().toISOString().split('T')[0];
      const payload = {
        contents: [{ parts: [{ text: text }] }],
        systemInstruction: { parts: [{ text: `Oggi è il ${todayStr}. Estrai i dettagli della spesa lavorativa dal testo fornito dall'utente. Associa la categoria e il pagamento ai valori rigorosamente consentiti. Restituisci i dati in JSON puro.` }] },
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              amount: { type: "NUMBER", description: "L'importo della spesa. Usa il punto come decimale." },
              category: { type: "STRING", description: "DEVE essere ESATTAMENTE uno tra: '🍽 Pranzo', '⛽ Carburante', '🅿️ Parcheggio', '🚗 Pedaggio', '🚌 Mezzo', '📦 Materiale', '💻 Software'" },
              payment_type: { type: "STRING", description: "DEVE essere ESATTAMENTE uno tra: 'anticipo', 'scontrino', 'fattura'" },
              date: { type: "STRING", description: "Data della spesa nel formato YYYY-MM-DD" },
              note: { type: "STRING", description: "Breve riassunto o dettaglio (es. nome cliente, luogo)" }
            },
            required: ["amount", "category", "payment_type", "date"]
          }
        }
      };

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const data = await fetchGeminiWithRetry(url, payload);
        const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!responseText) throw new Error("Risposta vuota dall'IA");
        
        const parsed = JSON.parse(responseText);

        // Compila automaticamente i campi di testo
        if (parsed.amount) document.getElementById('amountInput').value = parsed.amount;
        if (parsed.date) document.getElementById('dateInput').value = parsed.date;
        if (parsed.note) document.getElementById('noteInput').value = parsed.note;
        
        // Seleziona la Categoria corrispondente
        if (parsed.category) {
          const catChip = Array.from(document.querySelectorAll('#categoryChips .chip')).find(c => c.dataset.cat === parsed.category);
          if (catChip) catChip.click();
        }
        
        // Seleziona il Metodo di Pagamento corrispondente
        if (parsed.payment_type) {
          const payChip = Array.from(document.querySelectorAll('#payChips .chip')).find(c => c.dataset.pay === parsed.payment_type);
          if (payChip) payChip.click();
        }

        aiInput.value = '';
        showToast('✨ Modulo compilato automaticamente!');
      } catch (err) {
        console.error(err);
        showToast('Errore durante l\'analisi con Gemini.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    });

    // Logica di Sincronizzazione Manuale e Automatica verso Google Sheets
    async function syncToGoogleSheets() {
      const unsynced = allExpenses.filter(e => !e.synced);
      if (unsynced.length === 0) {
        showToast('Tutto già sincronizzato sul Cloud.');
        return;
      }

      const btn = document.getElementById('syncBtn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner w-3 h-3 border-accent"></span> Sincronizzazione in corso...';

      let successCount = 0;
      let hasErrors = false;

      // Invio sequenziale per non bloccare Google Apps Script
      for (let exp of unsynced) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(exp)
          });
          // Se va a buon fine, segno come sincronizzato
          exp.synced = true;
          successCount++;
        } catch (err) {
          console.error("Errore durante sync della spesa:", exp.__backendId, err);
          hasErrors = true;
        }
      }

      // Salva il nuovo stato (con i synced: true aggiornati)
      localStorage.setItem('spese_lavoro_data', JSON.stringify(allExpenses));
      
      // Aggiorna interfaccia
      updateSyncUI();
      renderList();
      renderStats();

      btn.disabled = false;
      btn.innerHTML = originalHtml;

      if (hasErrors) {
        showToast(`Sincronizzate ${successCount} su ${unsynced.length}. Riprova più tardi.`);
      } else {
        showToast(`✓ ${successCount} spese caricate su Google Sheets!`);
      }
    }

    // Tasto Sincronizza Manuale
    document.getElementById('syncBtn').addEventListener('click', () => {
      syncToGoogleSheets();
    });

    // Controllo Sincronizzazione Automatica Serale (dopo le 20:00)
    function checkAutoSync() {
      const now = new Date();
      const todayStr = now.toISOString().split('T')[0];
      const lastAutoSync = localStorage.getItem('last_auto_sync_date');

      // Se l'orario è >= 20, e non è stata fatta la sincronizzazione automatica oggi
      if (now.getHours() >= 20 && lastAutoSync !== todayStr) {
        const unsyncedCount = allExpenses.filter(e => !e.synced).length;
        if (unsyncedCount > 0) {
          showToast("Avvio sincronizzazione serale automatica...");
          syncToGoogleSheets().then(() => {
            // Se sincronizzato, segno la data di oggi come completata
            localStorage.setItem('last_auto_sync_date', todayStr);
          });
        } else {
          // Anche se non c'è nulla, segno il check come completato per oggi
          localStorage.setItem('last_auto_sync_date', todayStr);
        }
      }
    }

    // Controlla il timer automatico all'avvio dell'app e ogni 1 minuto se rimane aperta
    checkAutoSync();
    setInterval(checkAutoSync, 60000);

    // Scarica CSV
    document.getElementById('downloadCsvBtn').addEventListener('click', () => {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      
      const monthExpenses = allExpenses.filter(e => {
        if (!e.date) return false;
        const expDate = new Date(e.date);
        return expDate.getFullYear() === year && expDate.getMonth() === month;
      });

      if (monthExpenses.length === 0) {
        return showToast('Nessuna spesa da scaricare per questo mese.');
      }

      // Ordina per data (dalla più recente)
      monthExpenses.sort((a, b) => b.date.localeCompare(a.date));

      const header = 'Data,Categoria,Pagamento,Importo,Note';
      const rows = monthExpenses.map(e => {
        // Escapa le virgolette nelle note per evitare di rompere il CSV
        const note = (e.note || '').replace(/"/g, '""');
        return `${e.date},"${e.category}","${e.payment_type}",${e.amount.toFixed(2)},"${note}"`;
      });
      
      const csvContent = [header, ...rows].join('\n');
      
      // Aggiungiamo il BOM (\uFEFF) per fare in modo che Excel legga correttamente le emoji delle categorie
      const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const monthNames = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
      const fileName = `Spese_${monthNames[month]}_${year}.csv`;
      
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', fileName);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      
      showToast('✓ File CSV scaricato!');
    });

    // Utility HTML Escaper
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Notifica Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
