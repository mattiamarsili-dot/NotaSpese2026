<!doctype html>
<html lang="it" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spese Lavoro</title>
  
  <!-- Tailwind CSS per il design -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Lucide Icons per le icone -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0b0b0e',
            surface: '#141418',
            surface2: '#1e1e24',
            border: '#2a2a34',
            accent: '#c8f135',
            muted: '#777',
          }
        }
      }
    }
  </script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Space Grotesk', sans-serif; box-sizing: border-box; }
    .mono { font-family: 'DM Mono', monospace; }
    .chip { transition: all 0.15s; }
    .chip.sel { transform: scale(1.04); }
    input:focus { border-color: #c8f135 !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .spinner { width: 16px; height: 16px; border: 2px solid #333; border-top-color: #c8f135; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .expense-item { animation: fadeIn 0.25s ease; }
    .confirm-bar { display: flex; gap: 8px; margin-top: 8px; }
    .scroll-area { overflow-y: auto; -webkit-overflow-scrolling: touch; }
    
    /* Personalizzazioni colori per i bottoni */
    .btn-anticipo.sel { background-color: #facc15 !important; border-color: #facc15 !important; color: #000 !important; font-weight: bold !important; }
    .btn-scontrino.sel { background-color: #c8f135 !important; border-color: #c8f135 !important; color: #000 !important; font-weight: bold !important; }
    .btn-fattura.sel { background-color: #a78bfa !important; border-color: #a78bfa !important; color: #fff !important; font-weight: bold !important; }
  </style>
</head>

<body class="h-full bg-bg text-white">
  <div id="app" class="h-full flex flex-col overflow-auto">
    <!-- Header -->
    <header class="bg-surface border-b border-border px-4 py-3 flex items-center justify-between sticky top-0 z-50">
      <div class="mono text-accent text-sm font-medium tracking-wider" id="headerTitle">
        SPESE LAVORO
      </div>
      <div class="flex items-center gap-2">
        <span id="recordCount" class="text-xs text-muted mono">0 voci</span> 
        <span id="syncDot" class="w-2 h-2 rounded-full bg-green-500"></span>
      </div>
    </header>
    
    <!-- Tabs -->
    <nav class="flex bg-surface border-b border-border">
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-accent border-accent active-tab" data-tab="add"> 
        <i data-lucide="plus-circle" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>NUOVA 
      </button> 
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-muted border-transparent" data-tab="list"> 
        <i data-lucide="list" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>ELENCO 
      </button> 
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-muted border-transparent" data-tab="stats"> 
        <i data-lucide="bar-chart-3" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>RIEPILOGO
      </button>
      <button class="tab-btn flex-1 py-2.5 text-xs font-semibold text-center border-b-2 transition-all text-muted border-transparent" data-tab="check">
        <i data-lucide="scan-line" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>CONTROLLO
      </button>
    </nav>
    
    <!-- Add Panel -->
    <div id="panel-add" class="panel flex-1 p-4 scroll-area">
      
      <!-- Riga Unica: Importo + Data + Inserimento IA -->
      <div class="bg-surface border border-accent/30 rounded-2xl p-4 mb-4 relative overflow-hidden shadow-[0_0_15px_rgba(200,241,53,0.05)]">
        <div class="flex flex-col md:flex-row gap-3 items-end">
          
          <!-- Importo -->
          <div class="flex-1 w-full">
            <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Importo €</label> 
            <input type="number" id="amountInput" step="0.01" min="0" placeholder="0.00" class="w-full bg-surface2 border border-border rounded-xl text-white mono text-[16px] px-3 outline-none h-[46px]">
          </div>

          <!-- Data -->
          <div class="flex-1 w-full">
            <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Data</label> 
            <input type="date" id="dateInput" class="w-full bg-surface2 border border-border rounded-xl text-white mono text-[13px] px-3 outline-none h-[46px]">
          </div>

          <!-- Box Testo Libero -->
          <div class="flex-1 md:flex-[2] w-full">
            <label class="text-[10px] font-bold tracking-widest text-accent uppercase block mb-2 flex items-center gap-1">
              <i data-lucide="sparkles" class="w-3 h-3"></i> Testo Libero
            </label>
            <div class="flex items-center w-full bg-surface2 border border-border rounded-xl focus-within:border-accent transition-colors overflow-hidden h-[46px]">
              <input type="text" id="aiInput" placeholder="Es: 15€ parcheggio contanti..." class="flex-1 bg-transparent text-white text-sm outline-none w-full h-full px-3">
              <button id="aiParseBtn" class="bg-accent/10 hover:bg-accent/20 border-l border-accent/20 text-accent font-semibold transition-colors px-4 h-full flex items-center justify-center">
                 ✨
              </button>
            </div>
          </div>

        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Categoria</label>
        <div class="flex flex-wrap gap-1.5" id="categoryChips">
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🍽 Pranzo">🍽 Pranzo</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="⛽ Carburante">⛽ Carburante</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🅿️ Parcheggio">🅿️ Parcheggio</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🚗 Pedaggio">🚗 Pedaggio</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="🚌 Mezzo">🚌 Mezzo</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="📦 Materiale">📦 Materiale</button> 
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-cat="💻 Software">💻 Software</button>
        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Pagamento</label>
        <div class="flex flex-wrap gap-1.5" id="payChips">
          <button class="chip btn-anticipo px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="anticipo">💰 Anticipo</button> 
          <button class="chip btn-scontrino px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="scontrino">🧾 Scontrino</button> 
          <button class="chip btn-fattura px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-pay="fattura">📄 Fattura</button>
        </div>
      </div>
      
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <div>
          <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">Note (opzionale)</label> 
          <input type="text" id="noteInput" placeholder="Descrizione..." class="w-full bg-surface2 border border-border rounded-xl text-white text-sm px-3 py-2.5 outline-none">
        </div>
      </div>
      
      <button id="saveBtn" class="w-full bg-accent text-bg font-bold text-sm py-3 rounded-xl transition-all active:scale-[0.97] disabled:opacity-40"> 
        <i data-lucide="save" class="inline w-4 h-4 mr-1 align-middle"></i>SALVA SPESA 
      </button>
      <div id="saveError" class="text-red-400 text-xs text-center mt-2 hidden"></div>
    </div>
    
    <!-- List Panel -->
    <div id="panel-list" class="panel flex-1 p-4 scroll-area hidden">
      <div id="expenseList" class="space-y-2"></div>
      <div id="emptyList" class="text-center text-muted text-sm py-12">
        <i data-lucide="inbox" class="mx-auto mb-3 w-10 h-10 opacity-30"></i>
        <p>Nessuna spesa registrata</p>
      </div>
    </div>
    
    <!-- Stats Panel -->
    <div id="panel-stats" class="panel flex-1 p-4 scroll-area hidden">
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <div class="flex items-center justify-between mb-3">
          <label class="text-[10px] font-bold tracking-widest text-muted uppercase">Mese</label>
          <div class="flex items-center gap-2">
            <button id="prevMonth" class="p-1.5 bg-surface2 border border-border rounded-lg hover:border-accent transition-colors"> <i data-lucide="chevron-left" class="w-4 h-4"></i> </button> 
            <span id="monthDisplay" class="mono text-sm font-semibold min-w-[120px] text-center text-accent">Mese</span> 
            <button id="nextMonth" class="p-1.5 bg-surface2 border border-border rounded-lg hover:border-accent transition-colors"> <i data-lucide="chevron-right" class="w-4 h-4"></i> </button>
          </div>
        </div>
        <div id="totalAmount" class="mono text-4xl font-bold text-accent text-center py-4">
          € 0,00
        </div>
        <button id="syncBtn" class="w-full bg-accent/10 border border-accent/30 text-accent font-semibold text-xs py-2.5 rounded-lg hover:bg-accent/20 transition-all flex items-center justify-center gap-1"> 
          <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> <span id="syncBtnText">SINCRONIZZA SUL CLOUD</span> 
        </button>
        <button id="downloadCsvBtn" class="w-full mt-2 bg-surface2 border border-border text-white font-semibold text-xs py-2.5 rounded-lg hover:border-accent transition-all flex items-center justify-center"> 
          <i data-lucide="download" class="inline w-3.5 h-3.5 mr-1 align-middle"></i>SCARICA CSV DEL MESE
        </button>
      </div>

      <!-- AI Analysis -->
      <div class="bg-surface border border-accent/30 rounded-2xl p-4 mb-4">
        <button id="aiAnalyzeBtn" class="w-full bg-accent/10 border border-accent/50 text-accent font-semibold text-xs py-2.5 rounded-lg hover:bg-accent/20 transition-all flex items-center justify-center gap-2">
          ✨ Analizza Spese con IA
        </button>
        <div id="aiAnalysisResult" class="text-sm text-gray-300 mt-3 hidden leading-relaxed border-t border-border pt-3"></div>
      </div>

      <div id="monthBreakdown" class="space-y-3"></div>
    </div>

    <!-- Check Panel: scontrini fotografati vs estratto carta -->
    <div id="panel-check" class="panel flex-1 p-4 scroll-area hidden">

      <!-- Impostazioni IA -->
      <details id="aiSettings" class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <summary class="text-[10px] font-bold tracking-widest text-muted uppercase cursor-pointer">⚙️ Impostazioni IA (chiave Gemini)</summary>
        <p class="text-xs text-muted mt-3 mb-2">Chiave gratuita da <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" class="text-accent underline">aistudio.google.com/apikey</a>. Resta salvata solo su questo dispositivo.</p>
        <input type="password" id="apiKeyInput" placeholder="Incolla la chiave API" autocomplete="off" class="w-full bg-surface2 border border-border rounded-xl text-white text-sm px-3 py-2.5 outline-none mb-2">
        <input type="text" id="modelInput" placeholder="gemini-flash-latest" class="w-full bg-surface2 border border-border rounded-xl text-white mono text-xs px-3 py-2.5 outline-none mb-2">
        <button id="saveAiSettingsBtn" class="w-full bg-accent/10 border border-accent/30 text-accent font-semibold text-xs py-2.5 rounded-lg">SALVA IMPOSTAZIONI</button>
      </details>

      <!-- 1. Scontrini -->
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <div class="flex items-center justify-between mb-2">
          <label class="text-[10px] font-bold tracking-widest text-muted uppercase">1 · Foto scontrini</label>
          <span id="receiptCount" class="text-xs text-muted mono">0 letti</span>
        </div>
        <p class="text-xs text-muted mb-3">Scontrini stesi su fondo scuro, non sovrapposti, 8–12 per foto. Puoi scegliere più foto insieme.</p>
        <label class="w-full bg-accent text-bg font-bold text-sm py-3 rounded-xl flex items-center justify-center gap-1 cursor-pointer">
          <i data-lucide="camera" class="w-4 h-4"></i> <span id="photoBtnText">FOTOGRAFA / SCEGLI FOTO</span>
          <input type="file" id="receiptPhotos" accept="image/*" multiple class="hidden">
        </label>
        <div class="flex gap-2 mt-2">
          <label class="flex-1 bg-surface2 border border-border text-white font-semibold text-[11px] py-2 rounded-lg flex items-center justify-center cursor-pointer">
            Importa CSV scontrini
            <input type="file" id="receiptCsv" accept=".csv,text/csv,text/plain" class="hidden">
          </label>
          <button id="clearReceiptsBtn" class="flex-1 bg-surface2 border border-border text-red-400/80 font-semibold text-[11px] py-2 rounded-lg">Svuota scontrini</button>
        </div>
        <div id="receiptList" class="space-y-1.5 mt-3"></div>
      </div>

      <!-- 2. Estratto carta -->
      <div class="bg-surface border border-border rounded-2xl p-4 mb-4">
        <label class="text-[10px] font-bold tracking-widest text-muted uppercase block mb-2">2 · Estratto carta (Excel UniCredit)</label>
        <label class="w-full bg-surface2 border border-border text-white font-semibold text-xs py-2.5 rounded-lg flex items-center justify-center gap-1 cursor-pointer">
          <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> <span id="bankFileName">SCEGLI FILE EXCEL</span>
          <input type="file" id="bankFile" accept=".xlsx,.xls,.csv" class="hidden">
        </label>
        <div id="bankColumns" class="hidden mt-3 space-y-2 text-xs"></div>
      </div>

      <!-- 3. Risultato -->
      <div id="checkResult" class="hidden">
        <div class="flex flex-wrap gap-1.5 mb-3" id="checkFilter">
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium sel !bg-accent !border-accent !text-black !font-bold" data-filter="all">Tutti</button>
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-filter="pedaggio">🚗 Pedaggi</button>
          <button class="chip px-3 py-1.5 rounded-full border border-border bg-surface2 text-muted text-xs font-medium" data-filter="cibo">🍽 Cibo</button>
        </div>
        <div id="checkSummary" class="grid grid-cols-3 gap-2 mb-3"></div>
        <div id="checkLists" class="space-y-3"></div>
      </div>
    </div>
  </div>
  
  <div id="toast" class="toast bg-surface2 text-accent border border-accent/30"></div>
  
  <script>
    // --- CONFIGURAZIONE ---
    // URL del Google Apps Script che riceve i dati
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyG4vImpIpe5AY6m0BG-BmZPFTznScz4UEPnRJdnTeDgsklvjZJzid_GNfgqNNUC0UI/exec';

    // Chiave e modello Gemini: si impostano dalla scheda CONTROLLO e restano solo su questo dispositivo
    const DEFAULT_MODEL = 'gemini-flash-latest';
    function getApiKey() {
      try { return localStorage.getItem('gemini_api_key') || ''; } catch (e) { return ''; }
    }
    function getModel() {
      try { return localStorage.getItem('gemini_model') || DEFAULT_MODEL; } catch (e) { return DEFAULT_MODEL; }
    }
    function geminiUrl() {
      return `https://generativelanguage.googleapis.com/v1beta/models/${getModel()}:generateContent?key=${encodeURIComponent(getApiKey())}`;
    }

    // Funzione di utilità per chiamare Gemini con Retry automatico
    async function fetchGeminiWithRetry(url, payload, retries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) {
            const err = new Error(`HTTP ${res.status}`);
            err.status = res.status;
            throw err;
          }
          return await res.json();
        } catch (err) {
          // Chiave o modello sbagliati: inutile riprovare
          if (i === retries - 1 || [400, 401, 403, 404].includes(err.status)) throw err;
          await new Promise(r => setTimeout(r, delays[i]));
        }
      }
    }

    // State
    let allExpenses = [];
    let selectedCategory = null;
    let selectedPay = null;
    let deleteConfirmId = null;
    let currentMonth = new Date(); 

    // Inizializzazione data odierna
    document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];
    
    // Inizializza le icone al caricamento
    lucide.createIcons();

    // Caricamento Dati Locali
    function loadLocalData() {
      try {
        const savedData = localStorage.getItem('spese_lavoro_data');
        if (savedData) {
          allExpenses = JSON.parse(savedData);
        }
      } catch (e) {
        console.error("Errore nel caricamento dei dati locali", e);
      }
      document.getElementById('recordCount').textContent = allExpenses.length + ' voci';
      updateSyncUI();
      renderList();
      renderStats();
    }
    
    // Esegui caricamento dati all'avvio
    loadLocalData();

    // Aggiornamento interfaccia Sincronizzazione
    function updateSyncUI() {
      const unsyncedCount = allExpenses.filter(e => !e.synced).length;
      const dot = document.getElementById('syncDot');
      const syncBtnText = document.getElementById('syncBtnText');

      if (unsyncedCount > 0) {
        dot.classList.remove('bg-green-500');
        dot.classList.add('bg-orange-500', 'animate-pulse');
        if (syncBtnText) syncBtnText.textContent = `SINCRONIZZA SUL CLOUD (${unsyncedCount})`;
      } else {
        dot.classList.remove('bg-orange-500', 'animate-pulse');
        dot.classList.add('bg-green-500');
        if (syncBtnText) syncBtnText.textContent = `TUTTO SINCRONIZZATO`;
      }
    }

    // Gestione Tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('active-tab', 'text-accent', 'border-accent');
          b.classList.add('text-muted', 'border-transparent');
        });
        btn.classList.add('active-tab', 'text-accent', 'border-accent');
        btn.classList.remove('text-muted', 'border-transparent');

        document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
        document.getElementById('panel-' + btn.dataset.tab).classList.remove('hidden');
      });
    });

    // Chips Categoria
    document.querySelectorAll('#categoryChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#categoryChips .chip').forEach(c => {
          c.classList.remove('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold');
        });
        chip.classList.add('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold');
        selectedCategory = chip.dataset.cat;
      });
    });

    // Chips Pagamento
    document.querySelectorAll('#payChips .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#payChips .chip').forEach(c => {
          c.classList.remove('sel');
        });
        chip.classList.add('sel');
        selectedPay = chip.dataset.pay;
      });
    });

    // Funzione Salva
    document.getElementById('saveBtn').addEventListener('click', async () => {
      const amount = parseFloat(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;
      const note = document.getElementById('noteInput').value.trim();
      const errEl = document.getElementById('saveError');
      errEl.classList.add('hidden');

      if (!selectedCategory || !selectedPay || !amount || amount <= 0 || !date) {
        errEl.textContent = 'Compila categoria, pagamento, importo e data.';
        errEl.classList.remove('hidden');
        return;
      }

      // Crea l'oggetto spesa con flag synced a false
      const newExpense = {
        __backendId: Date.now().toString(),
        category: selectedCategory,
        payment_type: selectedPay,
        amount,
        date,
        note,
        created_at: new Date().toISOString(),
        synced: false // Flag per capire cosa deve essere inviato
      };

      try {
        // Salvataggio SOLO in Locale per massima velocità
        allExpenses.push(newExpense);
        localStorage.setItem('spese_lavoro_data', JSON.stringify(allExpenses));
        
        // Aggiorna UI
        document.getElementById('recordCount').textContent = allExpenses.length + ' voci';
        updateSyncUI();
        renderList();
        renderStats();

        showToast('✓ Salvato in locale! (Sincronizzazione in sospeso)');
        
        // Reset form
        document.getElementById('amountInput').value = '';
        document.getElementById('noteInput').value = '';
        selectedCategory = null; selectedPay = null;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('sel','!bg-accent','!border-accent','!text-black','!font-bold'));
        document.getElementById('dateInput').value = new Date().toISOString().split('T')[0];

      } catch (error) {
        console.error("Errore salvataggio locale:", error);
        errEl.textContent = 'Errore imprevisto di memoria.';
        errEl.classList.remove('hidden');
      }
    });

    // Render della Lista (Archivio)
    function renderList() {
      const container = document.getElementById('expenseList');
      const empty = document.getElementById('emptyList');
      const sorted = [...allExpenses].sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.created_at || '').localeCompare(a.created_at || ''));

      if (sorted.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

    // Logica di Sincronizzazione Manuale e Automatica verso Google Sheets
    async function syncToGoogleSheets() {
      const unsynced = allExpenses.filter(e => !e.synced);
      if (unsynced.length === 0) {
        showToast('Tutto già sincronizzato sul Cloud.');
        return;
      }

      const btn = document.getElementById('syncBtn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner w-3 h-3 border-accent"></span> Sincronizzazione in corso...';

      let successCount = 0;
      let hasErrors = false;

      // Invio sequenziale per non bloccare Google Apps Script
      for (let exp of unsynced) {
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(exp)
          });
          // Se va a buon fine, segno come sincronizzato
          exp.synced = true;
          successCount++;
        } catch (err) {
          console.error("Errore durante sync della spesa:", exp.__backendId, err);
          hasErrors = true;
        }
      }

      // Salva il nuovo stato (con i synced: true aggiornati)
      localStorage.setItem('spese_lavoro_data', JSON.stringify(allExpenses));
      
      // Aggiorna interfaccia
      updateSyncUI();
      renderList();
      renderStats();

      btn.disabled = false;
      btn.innerHTML = originalHtml;

      if (hasErrors) {
        showToast(`Sincronizzate ${successCount} su ${unsynced.length}. Riprova più tardi.`);
      } else {
        showToast(`✓ ${successCount} spese caricate su Google Sheets!`);
      }
    }

    document.getElementById('syncBtn').addEventListener('click', () => {
      syncToGoogleSheets();

      // Se l'orario è >= 20, e non è stata fatta la sincronizzazione automatica oggi
      if (now.getHours() >= 20 && lastAutoSync !== todayStr) {
        const unsyncedCount = allExpenses.filter(e => !e.synced).length;
        if (unsyncedCount > 0) {
          showToast("Avvio sincronizzazione serale automatica...");
          syncToGoogleSheets().then(() => {
            // Se sincronizzato, segno la data di oggi come completata

          });
        } else {

        }
      }
    }

    // Riduce la foto prima dell'invio: meno dati da caricare, stessa leggibilità
    function resizeImage(file, maxSide = 2400) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Immagine non leggibile')); };
        img.src = url;
      });
    }

        systemInstruction: { parts: [{ text: 'Leggi scontrini fiscali italiani. Per ciascuno: data dello scontrino (YYYY-MM-DD), importo TOTALE pagato (non i singoli articoli, non l\'IVA), nome dell\'esercente come appare in alto (insegna o ragione sociale), categoria e metodo di pagamento. Se un dato non è leggibile metti leggibile=false. Non inventare valori.' }] },
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'ARRAY',
            items: {
              type: 'OBJECT',
              properties: {
                data: { type: 'STRING', description: 'YYYY-MM-DD' },
                importo: { type: 'NUMBER', description: 'Totale pagato, punto come decimale' },

                leggibile: { type: 'BOOLEAN' }
              },
              required: ['data', 'importo', 'esercente', 'categoria', 'pagamento', 'leggibile']
            }
          }
        }
      };
      const data = await fetchGeminiWithRetry(geminiUrl(), payload);
      const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

    function renderReceipts() {
      document.getElementById('receiptCount').textContent = receipts.length + ' letti';
      const list = document.getElementById('receiptList');
      const sorted = [...receipts].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      list.innerHTML = sorted.map(r => `

          <button class="text-red-400/60 text-xs px-1 rdel" title="Elimina">✕</button>
        </div>`).join('');
      list.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', () => {
          const r = receipts.find(x => x.id === inp.closest('[data-rid]').dataset.rid);
          if (!r) return;
          if (inp.dataset.field === 'amount') r.amount = Math.abs(parseFloat(inp.value) || 0);
          else r[inp.dataset.field] = inp.value;
          if (inp.dataset.field === 'merchant' && guessCategory(r.merchant) !== 'altro') r.category = guessCategory(r.merchant);
          r.doubtful = false;
          saveReceipts();
          runCheck();
        });
      });
      list.querySelectorAll('.rdel').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.closest('[data-rid]').dataset.rid;
          receipts = receipts.filter(x => x.id !== id);
          saveReceipts();
          renderReceipts();
          runCheck();
        });
      });
    }

    // --- Lettura Excel della banca ---
    function loadSheetJs() {
      if (window.XLSX) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Libreria Excel non caricata (serve connessione)'));
        document.head.appendChild(s);
      });
    }

    function isoFromParts(y, m, d) {
      if (y < 100) y += 2000;
      if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
      return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function parseDateCell(v) {
      if (v === null || v === undefined || v === '') return '';
      if (v instanceof Date && !isNaN(v)) return isoFromParts(v.getFullYear(), v.getMonth() + 1, v.getDate());
      if (typeof v === 'number' && window.XLSX && v > 20000 && v < 80000) {
        const d = XLSX.SSF.parse_date_code(v);
        return d ? isoFromParts(d.y, d.m, d.d) : '';
      }
      const s = String(v).trim();
      let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return isoFromParts(+m[1], +m[2], +m[3]);
      m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
      if (m) return isoFromParts(+m[3], +m[2], +m[1]);
      return '';
    }

    function parseAmountCell(v) {
      if (typeof v === 'number') return v;
      let s = String(v ?? '').replace(/[€\s]/g, '').replace(/EUR/i, '');
      if (!s) return 0;
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    // Sceglie la colonna più probabile in base al nome dell'intestazione
    function pickColumn(header, patterns) {
      for (const p of patterns) {
        const idx = header.findIndex(h => p.test(String(h)));
        if (idx >= 0) return idx;
      }
      return -1;
    }

    document.getElementById('bankFile').addEventListener('change', async (ev) => {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      document.getElementById('bankFileName').textContent = file.name;
      try {
        await loadSheetJs();
        const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        bankRows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      } catch (err) {
        console.error(err);
        bankRows = [];
        return showToast('File non leggibile: ' + err.message);
      }

      // Intestazione = prima riga che ha sia una colonna "data" sia una colonna di importo
      bankHeaderIdx = bankRows.findIndex((row, i) => i < 40 &&
        row.some(c => /data/i.test(String(c))) &&
        row.some(c => /importo|addebit|uscit|ammontare|euro|dare/i.test(String(c))));
      if (bankHeaderIdx < 0) bankHeaderIdx = 0;
      const header = bankRows[bankHeaderIdx].map(h => String(h).trim());

      const dateCol = pickColumn(header, [/data.*(operaz|acquist|transaz)/i, /^data$/i, /data/i]);
      const amountCol = pickColumn(header, [/importo.*(eur|€)/i, /^importo/i, /addebit/i, /uscit|dare/i, /importo|ammontare|euro/i]);
      const descCol = pickColumn(header, [/esercente/i, /descrizione/i, /dettagl|causale|operazione/i]);

      const opts = (sel) => header.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${escHtml(h || 'Colonna ' + (i + 1))}</option>`).join('');
      const box = document.getElementById('bankColumns');
      box.innerHTML = `
        <p class="text-muted">Controlla che le colonne siano giuste:</p>
        <div class="flex items-center gap-2"><span class="w-24 text-muted">Data</span><select id="colDate" class="flex-1 bg-surface2 border border-border rounded-lg px-2 py-1.5 text-white">${opts(dateCol)}</select></div>
        <div class="flex items-center gap-2"><span class="w-24 text-muted">Importo</span><select id="colAmount" class="flex-1 bg-surface2 border border-border rounded-lg px-2 py-1.5 text-white">${opts(amountCol)}</select></div>
        <div class="flex items-center gap-2"><span class="w-24 text-muted">Descrizione</span><select id="colDesc" class="flex-1 bg-surface2 border border-border rounded-lg px-2 py-1.5 text-white">${opts(descCol)}</select></div>`;
      box.classList.remove('hidden');
      box.querySelectorAll('select').forEach(s => s.addEventListener('change', runCheck));
      runCheck();
    });

    function getBankMovements() {
      if (!bankRows.length) return [];
      const dc = +document.getElementById('colDate').value;
      const ac = +document.getElementById('colAmount').value;
      const sc = +document.getElementById('colDesc').value;
      return bankRows.slice(bankHeaderIdx + 1).map((row, i) => {
        const date = parseDateCell(row[dc]);
        const raw = parseAmountCell(row[ac]);
        const desc = String(row[sc] ?? '').trim();
        return { id: 'b' + i, date, amount: Math.abs(raw), desc, category: guessCategory(desc) };
      }).filter(m => m.date && m.amount > 0);
    }

    function shiftDays(iso, n) {
      return new Date(Date.parse(iso) + n * 86400000).toISOString().slice(0, 10);
    }

    function dayDiff(a, b) {
      return Math.abs((Date.parse(a) - Date.parse(b)) / 86400000);
    }

    function nameWords(s) {
      return new Set((s || '').toUpperCase().replace(/[^A-Z0-9À-Ü ]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !STOP_WORDS.has(w) && !/^\d+$/.test(w)));
    }

    // Abbinamento: stesso importo al centesimo, data entro 3 giorni (la banca registra dopo l'acquisto).
    // A parità, vince la data più vicina e l'esercente che somiglia alla descrizione.
    function matchReceipts(bank, recs) {
      const pairs = [];
      bank.forEach(m => {
        const mw = nameWords(m.desc);
        recs.forEach(r => {
          if (!r.date || Math.abs(m.amount - r.amount) > 0.005) return;
          const dd = dayDiff(m.date, r.date);
          if (isNaN(dd) || dd > 3) return;
          const sameName = [...nameWords(r.merchant)].some(w => mw.has(w) || [...mw].some(x => x.startsWith(w) || w.startsWith(x)));
          const sameCat = m.category !== 'altro' && m.category === r.category;
          pairs.push({ m, r, score: dd - (sameName ? 2 : 0) - (sameCat ? 1 : 0), sure: dd <= 2 && (sameName || sameCat) });
        });
      });
      pairs.sort((a, b) => a.score - b.score);
      const usedM = new Set(), usedR = new Set(), matches = [];
      pairs.forEach(p => {
        if (usedM.has(p.m.id) || usedR.has(p.r.id)) return;
        usedM.add(p.m.id); usedR.add(p.r.id);
        matches.push(p);
      });
      return {
        matches,
        bankOnly: bank.filter(m => !usedM.has(m.id)),
        receiptOnly: recs.filter(r => !usedR.has(r.id))
      };
    }

    document.querySelectorAll('#checkFilter .chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('#checkFilter .chip').forEach(c => c.classList.remove('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold'));
        chip.classList.add('sel', '!bg-accent', '!border-accent', '!text-black', '!font-bold');
        checkFilter = chip.dataset.filter;
        runCheck();
      });
    });

    function fmtDate(iso) {
      if (!iso) return '?';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y.slice(2)}`;
    }
    function fmtEur(n) {
      return '€ ' + n.toFixed(2).replace('.', ',');
    }

    function runCheck() {
      const bank = getBankMovements();
      const resultBox = document.getElementById('checkResult');
      if (!bank.length) { resultBox.classList.add('hidden'); return; }
      resultBox.classList.remove('hidden');

      // Il periodo è quello dell'estratto: gli scontrini fuori periodo non contano come "mancanti in banca"
      const dates = bank.map(m => m.date).sort();
      const from = dates[0], to = dates[dates.length - 1];
      const recsInPeriod = receipts.filter(r => !r.date || (r.date >= shiftDays(from, -3) && r.date <= shiftDays(to, 3)));

      const res = matchReceipts(bank, recsInPeriod);
      const keep = (cat) => checkFilter === 'all' || cat === checkFilter;
      const matches = res.matches.filter(p => keep(p.m.category) || keep(p.r.category));
      const bankOnly = res.bankOnly.filter(m => keep(m.category));
      // Gli scontrini pagati in contanti non possono comparire in banca: si segnalano a parte
      const receiptOnly = res.receiptOnly.filter(r => keep(r.category));

      document.getElementById('checkSummary').innerHTML = [
        ['✅', 'Abbinati', matches.length, 'text-green-400'],
        ['⚠️', 'Senza scontrino', bankOnly.length, 'text-orange-400'],
        ['❓', 'Non in banca', receiptOnly.length, 'text-sky-400']
      ].map(([ic, lbl, n, cls]) => `
        <div class="bg-surface border border-border rounded-xl p-2 text-center">
          <div class="mono text-xl font-bold ${cls}">${n}</div>
          <div class="text-[10px] text-muted uppercase tracking-wider">${ic} ${lbl}</div>
        </div>`).join('');

      const row = (left, right, sub) => `
        <div class="flex items-center justify-between bg-surface border border-border rounded-lg px-3 py-2">
          <div class="min-w-0"><div class="text-xs text-white truncate">${left}</div><div class="text-[10px] text-muted truncate">${sub}</div></div>
          <div class="mono text-xs font-bold text-accent ml-2 whitespace-nowrap">${right}</div>
        </div>`;
      const section = (title, cls, items) => items.length ? `
        <div><div class="text-[10px] font-bold tracking-widest uppercase mb-1.5 ${cls}">${title}</div><div class="space-y-1.5">${items.join('')}</div></div>` : '';

      document.getElementById('checkLists').innerHTML =
        section('⚠️ In banca senza scontrino', 'text-orange-400', bankOnly.map(m =>
          row(escHtml(m.desc || '(senza descrizione)'), fmtEur(m.amount), `${fmtDate(m.date)} · ${CHECK_CATS[m.category]}`))) +
        section('❓ Scontrini non trovati in banca', 'text-sky-400', receiptOnly.map(r =>
          row(escHtml(r.merchant || '(esercente illeggibile)'), fmtEur(r.amount), `${fmtDate(r.date)} · ${r.payment === 'contanti' ? 'pagato in contanti' : 'controlla data e importo'}`))) +
        section('✅ Abbinati', 'text-green-400', matches.sort((a, b) => a.m.date.localeCompare(b.m.date)).map(p =>
          row(`${p.sure ? '' : '🔸 '}${escHtml(p.r.merchant)}`, fmtEur(p.m.amount), `scontrino ${fmtDate(p.r.date)} · banca ${fmtDate(p.m.date)} · ${escHtml(p.m.desc)}`)));
    }

    loadReceipts();
    renderReceipts();

    // Utility HTML Escaper
    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function escAttr(s) {
      return escHtml(s).replace(/"/g, '&quot;');
    }

    // Notifica Toast
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
